<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreamFlix</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="loader" class="loader"><div class="logo">STREAMFLIX</div></div>
<div id="config-warning" class="config-warning hidden"></div>

<nav id="navbar" class="navbar">
  <div class="nav-left">
    <div class="logo">STREAMFLIX</div>
    <ul class="nav-links">
      <li><a href="#" data-view="home" class="active">Home</a></li>
      <li><a href="#" data-view="tv">TV Shows</a></li>
      <li><a href="#" data-view="movies">Movies</a></li>
      <li><a href="#" data-view="new">New &amp; Popular</a></li>
    </ul>
  </div>
  <div class="nav-right">
    <div class="search-wrap">
      <button id="search-toggle" class="icon-btn" aria-label="Search">🔍</button>
      <input id="search-input" type="text" placeholder="Titles, people, genres" />
    </div>
    <div class="profile-menu">
      <button id="avatar-btn" class="avatar-btn" aria-haspopup="true" aria-expanded="false">
        <span id="avatar-initial">U</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="caret"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div id="profile-dropdown" class="profile-dropdown hidden">
        <div class="profile-email" id="profile-email"></div>
        <div class="profile-meta" id="profile-meta"></div>
        <hr class="profile-divider" />
        <button id="logout-btn" class="dropdown-item">Sign Out of StreamFlix</button>
      </div>
    </div>
  </div>
</nav>

<header id="hero" class="hero"></header>

<main id="rows-wrap" class="rows-wrap"></main>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <div id="modal-video-wrap" class="modal-video-wrap"></div>
    <button id="modal-close" class="modal-close">✕</button>
    <div class="modal-body">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <div id="modal-tags" class="modal-tags"></div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
